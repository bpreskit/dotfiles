# Navigation keybindings
unbind Up
unbind Down
unbind Left
unbind Right
bind k select-pane -U
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D

# Window manipulation keybindings
unbind %
unbind '"'
bind | split-window -h
bind - split-window -v
bind / setw synchronize-panes

# Big options
setw -g mode-keys emacs
set-option -g prefix M-"'"
setw -g mouse on
set -g focus-events on
set-option -g default-shell /usr/bin/zsh

# Status bar
set -g default-terminal screen-256color
set -g status-right '#(TZ="America/Los_Angeles" date)'
# Other good options:
# - gray66
# - slategray
# - steelblue
# - lightsteelblue
# - mintcream
# - linen
# https://en.wikipedia.org/wiki/X11_color_names
set -g status-bg slategray
set -g pane-active-border-style fg=DodgerBlue3

# Highlight the current window instead of marking it with '*'. Keep the
# zoom flag, since that's still useful to see.
setw -g window-status-format ' #I:#W#{?window_zoomed_flag, Z,} '
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, Z,} '
setw -g window-status-current-style fg=white,bg=gray30,bold

# Window names. Unnamed windows show the current directory instead of 'zsh'.
# Naming a window (prefix-, or prompted on prefix-c) turns off automatic
# renaming for it, so the name sticks.
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g allow-rename off
bind c command-prompt -p 'window name:' "if-shell -F '#{==:%1,}' 'new-window' 'new-window -n \"%1\"'"

# Renumber windows when one is closed.
set -g renumber-windows on

# Visual indicator for when windows are sync'd.
set -ag status-left '#{?pane_synchronized,#[bg=red]SYNC!#[default],}'
set -ag status-left-length 32

# Override with local options
source-file -q .local-tmux.conf